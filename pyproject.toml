[project]
name = "nl2sql-research"
version = "0.1.0"
description = "A small, inspectable platform for measuring which context helps NL2SQL models."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "openai>=1.40",
    "fastembed>=0.4",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL with the loaded dataset",
]
