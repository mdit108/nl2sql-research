# E5 — metric semantics: the business definition AND the exact SQL rule.
#
# Authoring rule: every item must be self-contained. A metric is retrieved on its own, so it must not
# rely on a term defined in another item (e.g. "eligible orders", "revenue"). Spell the rule out.
# tests/unit/test_metric_definitions.py enforces this for the order-status filter.
version: 2
knowledge_type: metric
items:
  - id: met.revenue
    name: Revenue
    content: >
      Revenue is the value of products sold: SUM(order_items.price), excluding orders with
      orders.order_status IN ('canceled', 'unavailable'). It excludes freight and is not based on
      payments. Attribute revenue to time by orders.order_purchase_timestamp.
    metadata:
      sql_definition: "SUM(order_items.price) FILTER (WHERE orders.order_status NOT IN ('canceled','unavailable'))"
      tables: [order_items, orders]
      columns: [order_items.price, orders.order_status, orders.order_purchase_timestamp]
      caveats: [Excludes freight_value, Excludes canceled and unavailable orders]

  - id: met.number_of_orders
    name: Number of orders
    content: >
      Number of orders = COUNT(DISTINCT orders.order_id). Unless a question says otherwise (e.g.
      "sales", "revenue"), order counts include every status.
    metadata:
      sql_definition: COUNT(DISTINCT orders.order_id)
      tables: [orders]
      columns: [orders.order_id]

  - id: met.number_of_customers
    name: Number of customers
    content: >
      Number of customers = COUNT(DISTINCT customers.customer_unique_id). Never count
      customer_id, which equals the number of orders.
    metadata:
      sql_definition: COUNT(DISTINCT customers.customer_unique_id)
      tables: [customers]
      columns: [customers.customer_unique_id]

  - id: met.average_order_value
    name: Average order value (AOV)
    content: >
      Average order value = the average per-order product value. Compute each order's
      SUM(order_items.price), then average across orders:
      AVG(order_total) FROM (SELECT order_id, SUM(price) AS order_total ... GROUP BY order_id).
      Exclude orders with orders.order_status IN ('canceled', 'unavailable'). Exclude freight.
      Do not average item prices.
    metadata:
      sql_definition: "AVG(order_total) over per-order SUM(order_items.price), status NOT IN ('canceled','unavailable')"
      tables: [order_items, orders]
      columns: [order_items.price, orders.order_status]

  - id: met.customer_spend
    name: Customer spend (lifetime value)
    content: >
      Customer spend is the product value bought per person: SUM(order_items.price) grouped by
      customers.customer_unique_id (orders -> customers via customer_id), excluding orders with
      orders.order_status IN ('canceled', 'unavailable'). The "average customer" spend is the
      average of these per-person totals.
    metadata:
      sql_definition: "SUM(order_items.price) GROUP BY customers.customer_unique_id, status NOT IN ('canceled','unavailable')"
      tables: [order_items, orders, customers]
      columns: [order_items.price, customers.customer_unique_id]

  - id: met.best_customers
    name: Best / top / most valuable customers
    content: >
      "Best customers" means the top 10 customers by spend: SUM(order_items.price) grouped by
      customers.customer_unique_id, excluding orders with orders.order_status IN ('canceled',
      'unavailable'), highest first. Report customer_unique_id and their spend.
    metadata:
      sql_definition: "SUM(order_items.price) GROUP BY customer_unique_id ORDER BY 2 DESC LIMIT 10, status NOT IN ('canceled','unavailable')"
      tables: [order_items, orders, customers]
      columns: [customers.customer_unique_id, order_items.price]

  - id: met.repeat_customer_rate
    name: Repeat customer rate
    content: >
      Repeat customer rate = customers (customer_unique_id) with 2 or more distinct orders /
      customers with at least 1 order, counting only orders whose orders.order_status is NOT IN
      ('canceled', 'unavailable'). Expressed as a percentage.
    metadata:
      sql_definition: "COUNT(*) FILTER (WHERE n_orders >= 2)::numeric / COUNT(*) over per-customer_unique_id order counts, status NOT IN ('canceled','unavailable')"
      tables: [customers, orders]
      columns: [customers.customer_unique_id, orders.order_id, orders.order_status]

  - id: met.new_customers
    name: New customers (customer acquisition / adoption)
    content: >
      A new customer is counted in the month of their first order: MIN(order_purchase_timestamp)
      per customers.customer_unique_id, then count customers per date_trunc('month', first_order).
      Only orders whose orders.order_status is NOT IN ('canceled', 'unavailable') count as a first
      order. "Customer adoption" and "customer acquisition" mean new customers per month.
    metadata:
      sql_definition: "COUNT(*) GROUP BY date_trunc('month', MIN(order_purchase_timestamp) per customer_unique_id), status NOT IN ('canceled','unavailable')"
      tables: [customers, orders]
      columns: [customers.customer_unique_id, orders.order_purchase_timestamp]

  - id: met.late_delivery
    name: Late delivery and delivery delay
    content: >
      An order is late when orders.order_delivered_customer_date > orders.order_estimated_delivery_date.
      Delivery delay in days = order_delivered_customer_date::date - order_estimated_delivery_date::date.
      Late-delivery rate = late orders / delivered orders, where delivered orders have
      order_status = 'delivered' and a non-null order_delivered_customer_date.
    metadata:
      sql_definition: "AVG((order_delivered_customer_date > order_estimated_delivery_date)::int) over delivered orders"
      tables: [orders]
      columns: [orders.order_delivered_customer_date, orders.order_estimated_delivery_date, orders.order_status]

  - id: met.average_review_score
    name: Average review score
    content: >
      Average review score = AVG(order_reviews.review_score). When grouping by product, category
      or seller, first reduce to one row per (order, group) so orders with several items are not
      counted several times, then average the order's score.
    metadata:
      sql_definition: "AVG(review_score) over distinct (order_id, group) pairs"
      tables: [order_reviews, orders, order_items]
      columns: [order_reviews.review_score]

  - id: met.seller_performance
    name: Seller performance (sellers doing well / top sellers)
    content: >
      Seller performance is measured by seller revenue: SUM(order_items.price) grouped by
      order_items.seller_id, excluding orders with orders.order_status IN ('canceled', 'unavailable').
      "Sellers doing well" or "top sellers" means the top 10 sellers by that revenue, highest first.
    metadata:
      sql_definition: "SUM(order_items.price) GROUP BY seller_id ORDER BY 2 DESC LIMIT 10, status NOT IN ('canceled','unavailable')"
      tables: [order_items, orders, sellers]
      columns: [order_items.seller_id, order_items.price]

  - id: met.category_performance
    name: Product category performance (poorly / well performing products)
    content: >
      Product performance is judged at category level by customer satisfaction: average review score
      per category (English name), counting only categories with at least 100 reviewed orders.
      "Poorly performing products" means the 10 categories with the lowest average review score.
    metadata:
      sql_definition: "AVG(review_score) per category over distinct (order, category), HAVING >= 100 orders, ORDER BY ASC LIMIT 10"
      tables: [order_reviews, order_items, products, product_category_translation]
      columns: [order_reviews.review_score, product_category_translation.product_category_name_english]
